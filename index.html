<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti 💛</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* PANTALLA 1: CARTA */
    .card-screen {
      text-align: center;
      z-index: 10;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .envelope-box {
      width: 180px;
      height: 120px;
      background: linear-gradient(135deg, #ff6b81, #ff4757);
      border-radius: 12px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3);
      position: relative;
      cursor: pointer;
      animation: float 3s ease-in-out infinite;
    }

    .envelope-icon {
      font-size: 50px;
    }

    .btn-open {
      background: linear-gradient(45deg, #ffd700, #ffa500);
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-open:active {
      transform: scale(0.95);
    }

    /* PANTALLA 2: FLORES */
    .flowers-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    .flowers-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .svg-container {
      width: 280px;
      height: 280px;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    h1 {
      color: #ffe066;
      font-size: 24px;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(255, 224, 102, 0.5);
      letter-spacing: 1px;
    }

    /* EFECTOS DE DESTELLOS */
    .sparkle {
      position: absolute;
      background: radial-gradient(circle, #fff 10%, #ffd700 80%, transparent 100%);
      border-radius: 50%;
      pointer-events: none;
      animation: sparkleAnim linear infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.98); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3)); }
      100% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6)); }
    }

    @keyframes sparkleAnim {
      0% { transform: translateY(0) scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE LA CARTA -->
  <div class="card-screen" id="cardScreen">
    <div class="envelope-box" onclick="openCard()">
      <div class="envelope-icon">✉️</div>
    </div>
    <button class="btn-open" onclick="openCard()">Abrir 💛</button>
  </div>

  <!-- PANTALLA DE LAS FLORES -->
  <div class="flowers-screen" id="flowersScreen">
    <div class="svg-container">
      <svg viewBox="0 0 300 300" width="100%" height="100%">
        <!-- Hojas y tallos -->
        <path d="M150 220 Q120 240 100 270" stroke="#4a7c59" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M150 220 Q180 240 200 270" stroke="#4a7c59" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M150 220 L150 280" stroke="#385e43" stroke-width="10" fill="none" stroke-linecap="round"/>
        
        <path d="M110 240 Q70 230 60 210 Q90 200 120 220" fill="#5c8a67"/>
        <path d="M190 240 Q230 230 240 210 Q210 200 180 220" fill="#5c8a67"/>

        <!-- Girasol Principal (Centro) -->
        <g transform="translate(150, 150)">
          <!-- Pétalos -->
          <g fill="#ffd700">
            <ellipse rx="14" ry="45" transform="rotate(0)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(30)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(60)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(90)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(120)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(150)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(180)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(210)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(240)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(270)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(300)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(330)" y="-35"/>
          </g>
          <g fill="#ffae00">
            <ellipse rx="10" ry="38" transform="rotate(15)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(45)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(75)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(105)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(135)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(165)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(195)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(225)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(255)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(285)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(315)" y="-30"/>
            <ellipse rx="10" ry="38" transform="rotate(345)" y="-30"/>
          </g>
          <!-- Centro -->
          <circle r="30" fill="#3d2314"/>
          <circle r="25" fill="#2b180d"/>
        </g>

        <!-- Girasol Izquierdo -->
        <g transform="translate(90, 110) scale(0.75)">
          <g fill="#ffd700">
            <ellipse rx="14" ry="45" transform="rotate(0)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(45)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(90)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(135)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(180)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(225)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(270)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(315)" y="-35"/>
          </g>
          <circle r="26" fill="#3d2314"/>
        </g>

        <!-- Girasol Derecho -->
        <g transform="translate(210, 110) scale(0.75)">
          <g fill="#ffd700">
            <ellipse rx="14" ry="45" transform="rotate(0)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(45)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(90)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(135)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(180)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(225)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(270)" y="-35"/>
            <ellipse rx="14" ry="45" transform="rotate(315)" y="-35"/>
          </g>
          <circle r="26" fill="#3d2314"/>
        </g>
      </svg>
    </div>
    <h1>¡Flores amarillas para ti! 💛✨</h1>
  </div>

  <script>
    function openCard() {
      const cardScreen = document.getElementById('cardScreen');
      const flowersScreen = document.getElementById('flowersScreen');

      cardScreen.style.opacity = '0';
      cardScreen.style.transform = 'scale(0.8)';

      setTimeout(() => {
        cardScreen.style.display = 'none';
        flowersScreen.classList.add('active');
        createSparkles();
      }, 800);
    }

    function createSparkles() {
      for (let i = 0; i < 35; i++) {
        setTimeout(() => {
          const sparkle = document.createElement('div');
          sparkle.className = 'sparkle';
          
          const size = Math.random() * 8 + 4;
          sparkle.style.width = size + 'px';
          sparkle.style.height = size + 'px';
          
          sparkle.style.left = Math.random() * 100 + 'vw';
          sparkle.style.top = (Math.random() * 50 + 50) + 'vh';
          
          sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
          
          document.body.appendChild(sparkle);

          setTimeout(() => sparkle.remove(), 4000);
        }, i * 120);
      }
    }
  </script>
</body>
</html>
